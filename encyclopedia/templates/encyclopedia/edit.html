{% extends "encyclopedia/layout.html" %}
{% block body %}
  <div class="form-container">
    <h1>Edit: {{ title }}</h1>
    <form action="{% url 'encyclopedia:edit' title %}" method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-primary">Save Changes</button>
    </form>
  </div>
{% endblock %}
